/**:
  ros__parameters:
    robot_type: "UGV_WHEELED"
    model_name: "turtlebot3_burger"
    
    capabilities:
      MOBILITY: 0.6
      PERCEPTION: 0.0
      BATTERY: 1.0

    thresholds:
      MOBILITY: 0.3
      PERCEPTION: 0.0
      BATTERY: 0.15

    fault_impacts:
      mobility_failure: 0.0
      perception_failure: 0.1
      battery_failure: 0.5
    
    nav2:
      enabled: true
      use_sim_time: false
      map_yaml: "room_map.yaml"
      params_file: "nav2_tb3.yaml"
      initial_pose:
        x: 0.0
        y: 0.0
        yaw_degrees: 0.0

    telemetry:
      has_battery: true
      battery_topic: "battery_state"
      battery_v_max: 12.6
      battery_v_min: 11.1
      
      watchdogs:
        topics: ["odom", "scan"]
        types: ["nav_msgs.msg.Odometry", "sensor_msgs.msg.LaserScan"]
        capabilities: ["MOBILITY", "PERCEPTION"]
        reliability:  ["reliable", "best_effort"]
        timeouts: [2.0, 2.0]